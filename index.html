<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGM48 TEAM C - Handshake Schedule</title>
    <style>
        /* ตั้งค่าฟอนต์และพื้นหลัง */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* กรอบแสดงผลหลัก */
        .container {
            max-width: 600px;
            width: 100%;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }

        h1 {
            color: #4b9e9e; /* สีเขียวอมฟ้าอิงจากโปสเตอร์ */
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        p.date {
            text-align: center;
            color: #aaaaaa;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        /* ส่วนของ Dropdown เลือกเมมเบอร์ */
        .filter-group {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #dddddd;
        }

        select {
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #ffffff;
            outline: none;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus {
            border-color: #4b9e9e;
        }

        /* ตารางแสดงผล */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 15px 12px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        th {
            background-color: #262626;
            color: #4b9e9e;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        tr:hover {
            background-color: #252525;
        }

        .lane-badge {
            background-color: #921727; /* สีแดงเข้มจากโปสเตอร์ */
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
        }

        .time {
            font-weight: bold;
            font-size: 1.05rem;
        }

        .close-time {
            font-size: 0.8rem;
            color: #ff6b6b;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>CGM48 TEAM C Handshake</h1>
    <p class="date">23.08.2026 @ Avenue A, G Floor, MBK Center</p>

    <div class="filter-group">
        <label for="memberSelect">เลือกลูกพี่ (Select Member):</label>
        <select id="memberSelect">
            <!-- ตัวเลือกจะถูกสร้างอัตโนมัติด้วย JavaScript -->
        </select>
    </div>

    <table id="scheduleTable">
        <thead>
            <tr>
                <th>Round</th>
                <th>Time</th>
                <th>Lane</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- ข้อมูลตารางจะแสดงตรงนี้ -->
        </tbody>
    </table>
</div>

<script>
    // ข้อมูลเวลาและรอบจากโปสเตอร์
    const roundsInfo = {
        "1": { time: "11:00 - 12:00", close: "11:45" },
        "2": { time: "12:00 - 13:00", close: "12:45" },
        "3": { time: "13:00 - 14:00", close: "13:45" },
        "4": { time: "14:00 - 15:00", close: "14:45" },
        "5": { time: "15:00 - 16:00", close: "15:45" },
        "6": { time: "16:00 - 17:00", close: "16:45" },
        "7": { time: "17:00 - 18:00", close: "17:45" },
        "8": { time: "18:00 - 19:00", close: "18:45" },
        "SP1": { time: "19:30", close: "19:30" }, 
        "SP2": { time: "20:30", close: "20:30" }
    };

    // ข้อมูลตารางงานของเมมเบอร์แต่ละคน
    const membersData = {
        "ELSE": [{ round: "1", lane: "LANE 1" }, { round: "4", lane: "LANE 1" }],
        "GINNA": [{ round: "6", lane: "LANE 1" }],
        "JINGJING": [{ round: "3", lane: "LANE 1" }, { round: "7", lane: "LANE 1" }, { round: "SP1", lane: "SP 1" }],
        "KWAN": [{ round: "3", lane: "LANE 2" }, { round: "8", lane: "LANE 1" }, { round: "SP2", lane: "SP 2" }],
        "LINGLING": [{ round: "2", lane: "LANE 1" }, { round: "5", lane: "LANE 1" }],
        "LOOKKED": [{ round: "1", lane: "LANE 2" }, { round: "4", lane: "LANE 2" }],
        "NANA": [{ round: "2", lane: "LANE 2" }, { round: "8", lane: "LANE 2" }, { round: "SP2", lane: "SP 2" }],
        "NISHA": [{ round: "3", lane: "LANE 3" }, { round: "7", lane: "LANE 2" }, { round: "SP1", lane: "SP 1" }],
        "PLOEN": [{ round: "3", lane: "LANE 4" }, { round: "8", lane: "LANE 3" }, { round: "SP2", lane: "SP 2" }],
        "PRAE": [{ round: "1", lane: "LANE 3" }, { round: "4", lane: "LANE 3" }]
    };

    const selectElement = document.getElementById('memberSelect');
    const table = document.getElementById('scheduleTable');
    const tableBody = document.getElementById('tableBody');

    // สร้างตัวเลือก (Dropdown Options) ลงใน HTML
    Object.keys(membersData).forEach(member => {
        const option = document.createElement('option');
        option.value = member;
        option.textContent = member;
        
        // ตั้งค่าเริ่มต้นเป็น LOOKKED ไว้ให้
        if (member === "LOOKKED") {
            option.selected = true;
        }
        selectElement.appendChild(option);
    });

    // ฟังก์ชันอัปเดตข้อมูลในตารางเมื่อเลือกเมมเบอร์
    function updateTable() {
        const selectedMember = selectElement.value;
        tableBody.innerHTML = ''; // เคลียร์ข้อมูลเก่า

        if (selectedMember && membersData[selectedMember]) {
            membersData[selectedMember].forEach(entry => {
                const roundDetail = roundsInfo[entry.round];
                
                const row = document.createElement('tr');
                
                // คอลัมน์ Round
                const tdRound = document.createElement('td');
                tdRound.style.fontWeight = 'bold';
                tdRound.textContent = entry.round.startsWith('SP') ? "SPECIAL" : `Round ${entry.round}`;
                
                // คอลัมน์ Time & Lane Close
                const tdTime = document.createElement('td');
                tdTime.innerHTML = `
                    <div class="time">${roundDetail.time}</div>
                    <div class="close-time">Lane Close: ${roundDetail.close}</div>
                `;
                
                // คอลัมน์ Lane (Badge)
                const tdLane = document.createElement('td');
                tdLane.innerHTML = `<span class="lane-badge">${entry.lane}</span>`;

                row.appendChild(tdRound);
                row.appendChild(tdTime);
                row.appendChild(tdLane);
                tableBody.appendChild(row);
            });
            table.style.display = 'table';
        } else {
            table.style.display = 'none';
        }
    }

    // ดักจับเหตุการณ์เมื่อมีการเปลี่ยน Dropdown
    selectElement.addEventListener('change', updateTable);

    // โหลดข้อมูลขึ้นมาแสดงครั้งแรกทันที
    updateTable();
</script>
</body>
</html>
